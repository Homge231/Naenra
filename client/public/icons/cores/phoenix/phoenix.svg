<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b0606" />
      <stop offset="100%" stop-color="#120101" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.3" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <polygon points="64,6 114,35 114,93 64,122 14,93 14,35" fill="url(#borderGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#bgGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#innerGlow)" />
  </g>
  <g filter="url(#glow)">
    <g stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64,28 C44,48 40,78 64,100 C88,78 84,48 64,28 Z" fill="#f97316" fill-opacity="0.2" stroke-width="4"/>
      <path d="M64,48 C54,60 52,78 64,90 C76,78 74,60 64,48 Z" fill="#fef08a" stroke="#ef4444" stroke-width="3"/>
    </g>
  </g>
</svg>
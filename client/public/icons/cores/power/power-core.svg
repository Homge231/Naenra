<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0815" />
      <stop offset="100%" stop-color="#120309" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <polygon points="64,6 114,35 114,93 64,122 14,93 14,35" fill="url(#borderGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#bgGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#innerGlow)" />
  </g>
  <g filter="url(#glow)">
    <g stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52,96 L52,76 L76,76 L76,96 Z" fill="#f43f5e" fill-opacity="0.2" stroke-width="3" />
      <rect x="46" y="56" width="36" height="20" rx="3" fill="#ec4899" fill-opacity="0.3" stroke-width="5" />
      <path d="M46,62 C40,62 40,70 46,70" stroke-width="4" />

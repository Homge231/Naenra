<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#031b2e" />
      <stop offset="100%" stop-color="#010a12" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <polygon points="64,6 114,35 114,93 64,122 14,93 14,35" fill="url(#borderGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#bgGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#innerGlow)" />
  </g>
  <g filter="url(#glow)">
    <g stroke="#0284c7" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64,32 L92,44 L92,72 C92,90 64,100 64,100 C64,100 36,90 36,72 L36,44 Z" fill="#38bdf8" fill-opacity="0.2" stroke-width="4"/>
      <polygon points="64,48 78,56 78,74 64,82 50,74 50,56" fill="#0284c7" stroke="#bae6fd" stroke-width="2"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0538" />
      <stop offset="100%" stop-color="#0b0117" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f0abfc" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#9333ea" stop-opacity="0" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.3" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <polygon points="64,6 114,35 114,93 64,122 14,93 14,35" fill="url(#borderGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#bgGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#innerGlow)" />
  </g>
  <g filter="url(#glow)">
    <g stroke="#9333ea" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="64,36 90,50 64,64 38,50" fill="#c084fc" fill-opacity="0.3" stroke="#f0abfc" stroke-width="3"/>
      <polygon points="38,50 64,64 64,92 38,78" fill="#9333ea" fill-opacity="0.4"/>
      <polygon points="90,50 64,64 64,92 90,78" fill="#581c87" fill-opacity="0.5"/>
    </g>
  </g>
</svg>

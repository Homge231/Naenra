<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#150833" />
      <stop offset="100%" stop-color="#070217" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <polygon points="64,6 114,35 114,93 64,122 14,93 14,35" fill="url(#borderGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#bgGrad)" />
    <polygon points="64,9 111,36 111,92 64,119 17,92 17,36" fill="url(#innerGlow)" />
  </g>
  <g filter="url(#glow)">
    <g stroke="#8b5cf6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28,64 C40,44 88,44 100,64 C88,84 40,84 28,64 Z" fill="#a78bfa" fill-opacity="0.2" stroke-width="4" />
      <circle cx="64" cy="64" r="14" stroke="#ddd6fe" stroke-width="3.5" />
      <circle cx="64" cy="64" r="6" fill="#ddd6fe" />
      <line x1="64" y1="44" x2="64" y2="34" stroke="#a78bfa" />
      <line x1="48" y1="52" x2="40" y2="44" stroke="#a78bfa" />
      <line x1="80" y1="52" x2="88" y2="44" stroke="#a78bfa" />
    </g>
  </g>
</svg>
